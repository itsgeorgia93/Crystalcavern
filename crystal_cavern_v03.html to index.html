<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crystal Cavern — Prototype 0.3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10152d;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#1b2147dd;border:1px solid #9d8ad366;border-radius:22px;color:#fff;padding:9px 13px;font-weight:750;box-shadow:0 4px 18px #080c2277}.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);background:#151a38c9;color:#e6dcff;padding:10px 16px;border-radius:20px;white-space:nowrap;font-size:13px;pointer-events:none}.title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 65px);left:0;right:0;text-align:center;color:#f5d9ff;font-weight:850;letter-spacing:2px;text-shadow:0 2px 10px #a354e5;pointer-events:none;font-size:14px}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill" id="count">💎 0 crystals</div><div class="pill" id="bag">🎒 Sack 0</div></div><div class="title">✦ CRYSTAL CAVERN v0.3 ✦</div><div class="hint">👆 Hold: walk • ↕️ Swipe: look around • ✨ Auto-mine</div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr,now=0,last=0,elapsed=0,score=0;const player={x:0,y:0},target={x:0,y:0};let held=false,looking=false,gesture=null,camX=0,camY=0,particles=[],bolts=[],nodes=[],distance=0;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=W/2;player.y=H*.75;target.x=player.x;target.y=player.y;spawn()}function spawn(){nodes=[];for(let i=0;i<24;i++){let y=H*.1+(i/24)*H*1.3;nodes.push(makeNode(y,i))}}function makeNode(y,i){let rare=i%5===0,uncommon=!rare&&i%3===0,side=i%2?-1:1;let x=W/2+side*(rare?W*.37:uncommon?W*.28:W*.17);return {x,y,hp:rare?9:uncommon?5:2,maxHp:rare?9:uncommon?5:2,r:rare?24:uncommon?19:15,color:rare?'#ffb85c':uncommon?'#d7a1ff':'#79f4e9',tier:rare?3:uncommon?2:1,alive:true,respawn:0}}canvas.addEventListener('pointerdown',e=>{gesture={id:e.pointerId,x:e.clientX,y:e.clientY,ox:camX,oy:camY};held=true;looking=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>13)looking=true;if(looking){held=false;camX=Math.max(-W*.24,Math.min(W*.24,gesture.ox+dx));camY=Math.max(-H*.38,Math.min(H*.38,gesture.oy+dy))}});
function endGesture(e){if(!gesture||e.pointerId!==gesture.id)return;gesture=null;held=false;looking=false}
['pointerup','pointercancel','lostpointercapture'].forEach(t=>canvas.addEventListener(t,endGesture));
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function crystal(n){const {x,y,r,color}=n;ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=17;ctx.beginPath();ctx.moveTo(0,-r*1.4);ctx.lineTo(r*.8,-r*.35);ctx.lineTo(r*.55,r);ctx.lineTo(-r*.65,r);ctx.lineTo(-r*.85,-r*.25);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(0,-r*1.4);ctx.lineTo(0,r);ctx.lineTo(-r*.65,r);ctx.lineTo(-r*.85,-r*.25);ctx.closePath();ctx.fillStyle='#ffffff55';ctx.fill();ctx.strokeStyle='#f9efff';ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}function drawScene(t){let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1530');bg.addColorStop(.6,'#203357');bg.addColorStop(1,'#31425b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let side of [-1,1]){ctx.fillStyle=side<0?'#172846':'#1a2c4c';ctx.beginPath();ctx.moveTo(side<0?0:W,0);ctx.lineTo(W/2+side*W*.19,H*.13);ctx.lineTo(W/2+side*W*.46,H);ctx.lineTo(side<0?0:W,H);ctx.fill()}ctx.beginPath();ctx.moveTo(W*.42,H*.16);ctx.lineTo(W*.58,H*.16);ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#364767');g.addColorStop(1,'#66748c');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#91a3c344';ctx.lineWidth=3;ctx.stroke();for(let i=0;i<40;i++){let x=(i*137.3)%W,y=(i*83.7)%H;circle(x,y,1.2+Math.sin(t*.001+i)*.8,['#85f8fa88','#f5a3f388','#ffe0a688'][i%3])}ctx.save();ctx.translate(camX,camY);for(let n of nodes)if(n.alive)crystal(n);ctx.restore()}function goblin(t){let x=player.x,y=player.y,bob=held?Math.sin(t*.014)*3:Math.sin(t*.003)*1;circle(x,y+27,24,'#101a2a88');ctx.save();ctx.translate(x,y+bob);let bagSize=14+Math.min(score,50)*.35;circle(19,10,bagSize,'#b88956');circle(19,10,bagSize*.65,'#d7b17a');ctx.fillStyle='#69528e';ctx.fillRect(-13,8,27,25);circle(-9,30,8,'#65518e');circle(9,30,8,'#65518e');ctx.fillStyle='#8bca99';ctx.beginPath();ctx.moveTo(-16,-11);ctx.lineTo(-31,-19);ctx.lineTo(-20,2);ctx.fill();ctx.beginPath();ctx.moveTo(16,-11);ctx.lineTo(31,-19);ctx.lineTo(20,2);ctx.fill();circle(0,-13,21,'#8bca99');circle(-7,-14,3,'#1c2840');circle(7,-14,3,'#1c2840');ctx.strokeStyle='#34424a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-9,5,.1,Math.PI-.1);ctx.stroke();ctx.fillStyle='#66548e';ctx.beginPath();ctx.moveTo(-20,-23);ctx.lineTo(0,-51);ctx.lineTo(21,-23);ctx.closePath();ctx.fill();circle(0,-24,20,'#8b70b3');ctx.fillStyle='#c7a8ec';ctx.fillRect(-22,-27,44,7);ctx.restore()}function update(dt,t){if(held){camX+=(0-camX)*Math.min(1,dt*.005);camY+=(0-camY)*Math.min(1,dt*.005);let step=dt*.065;distance+=step;for(let n of nodes){n.y+=step*(.65+n.y/H*.55);if(n.y>H+55){Object.assign(n,makeNode(-rand(30,H*.35),Math.floor(rand(0,40))))}}}elapsed+=dt;if(elapsed>=2000){elapsed-=2000;let choices=nodes.filter(n=>n.alive&&n.y+camY>H*.2&&n.y+camY<H*.88).sort((a,b)=>a.tier-b.tier||Math.abs(a.y+camY-player.y)-Math.abs(b.y+camY-player.y));let n=choices[0];if(n)bolts.push({x:player.x,y:player.y-20,tx:n.x,ty:n.y,node:n,p:0})}for(let b of bolts){b.p+=dt/260;if(b.p>=1&&!b.done){b.done=true;if(b.node.alive){b.node.hp--;for(let i=0;i<9;i++)particles.push({x:b.node.x,y:b.node.y,vx:rand(-.13,.13),vy:rand(-.2,.04),life:rand(400,750),color:b.node.color});if(b.node.hp<=0){b.node.alive=false;score+=b.node.tier;document.getElementById('count').textContent='💎 '+score+' crystals';document.getElementById('bag').textContent='🎒 Sack '+score;b.node.respawn=rand(1800,3600)}}}}bolts=bolts.filter(b=>!b.done);for(let n of nodes){if(!n.alive){n.respawn-=dt;if(n.respawn<=0){n.alive=true;n.hp=n.maxHp}}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}function frame(t){let dt=Math.min(t-last||16,50);last=t;update(dt,t);drawScene(t);for(let b of bolts){ctx.strokeStyle='#9cfbff';ctx.shadowColor='#8cfaff';ctx.shadowBlur=15;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+(b.tx+camX-b.x)*b.p,b.y+(b.ty+camY-b.y)*b.p);ctx.stroke();ctx.shadowBlur=0}for(let p of particles)circle(p.x+camX,p.y+camY,3,p.color);goblin(t);requestAnimationFrame(frame)}addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
